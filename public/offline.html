<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #020617; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      p { margin: 0; color: #94a3b8; max-width: 22rem; }
      button { margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 12px; background: #fbbf24; color: #451a03; font-weight: 700; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 style="margin: 0; font-size: 22px">You're offline</h1>
      <p>The live auction needs an internet connection. It will pick up where it left off as soon as you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
